# Acceptance gates (docs/10): install → lint → typecheck → test → build →
# npm pack dry-run (tarball must contain CLI, web assets and migrations).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify npm tarball contents
        run: |
          npm pack --dry-run > pack.txt
          grep -q "dist/cli.js" pack.txt
          grep -q "dist/web/index.html" pack.txt
          grep -q "migrations/0001_initial_schema.sql" pack.txt
          grep -q "CHANGELOG.md" pack.txt
          echo "tarball OK"
