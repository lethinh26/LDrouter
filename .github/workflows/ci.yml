# Acceptance gates (docs/10): install → lint → typecheck → test → build →
# npm pack dry-run (tarball must contain CLI, web assets and migrations),
# plus an isolated Docker Compose smoke test. Never publishes/deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    # Playwright 1.55 supports Ubuntu 24.04, not Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # version from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and verify npm tarball contents
        id: build
        run: |
          # Run explicit build (no need for prepack hook since we removed it)
          pnpm run build
          # Resolve the compiled ESM graph before downloading a browser.
          node --input-type=module -e "await import('./dist/server/app.js')"
          node dist/quota-sync.js --help | grep -q 'ldrouter-quota-sync --gateway'
          # Capture npm pack output to verify all required files are included
          OUTPUT=$(npm pack --dry-run 2>&1)
          echo "Tarball contents:"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dist/cli.js" || { echo "FAIL: dist/cli.js not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "dist/quota-sync.js" || { echo "FAIL: quota sync CLI not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "dist/web/index.html" || { echo "FAIL: dist/web/index.html not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0001_initial_schema.sql" || { echo "FAIL: migrations not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0015_adaptive_combo_state.sql" || { echo "FAIL: adaptive migration not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0017_provider_integrations.sql" || { echo "FAIL: integration migration not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0018_combo_kind.sql" || { echo "FAIL: native combo migration not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0019_provider_connections.sql" || { echo "FAIL: built-in connection migration not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0020_gateway_oauth.sql" || { echo "FAIL: gateway OAuth migration not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0021_subscription_quotas.sql" || { echo "FAIL: subscription quota migration not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "CHANGELOG.md" || { echo "FAIL: CHANGELOG.md not in tarball"; exit 1; }
          echo "✓ tarball OK"
      - name: Browser smoke (isolated mock upstream)
        run: |
          python3 -m venv "$RUNNER_TEMP/ldrouter-e2e"
          "$RUNNER_TEMP/ldrouter-e2e/bin/python" -m pip install playwright==1.55.0
          "$RUNNER_TEMP/ldrouter-e2e/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/ldrouter-e2e/bin/python" tests/e2e/adaptive_combo_smoke.py
      - name: Native client CLI smoke (network-isolated fixtures)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          PREFIX="$RUNNER_TEMP/ldrouter-cli-fixture"
          mkdir -p "$PREFIX/home"
          env -i HOME="$PREFIX/home" PATH="$PATH" npm install --prefix "$PREFIX" --no-save --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org @openai/codex@0.172.0 @anthropic-ai/claude-code@2.1.326
          bash tests/e2e/client_cli_smoke.sh "$PREFIX"

  docker-smoke:
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ldrouter-ci-${{ github.run_id }}-${{ github.run_attempt }}
      LATEDEV_IMAGE: local/ldrouter:ci-${{ github.run_id }}
      # Public test-only key, exactly 32 ASCII bytes. Never use it in production.
      LATEDEV_MASTER_KEY: '0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v7
      - name: Build and start isolated service
        run: |
          docker compose build latedev-router
          docker compose up -d --no-build --pull never --wait --wait-timeout 120 latedev-router
          curl --fail --silent --show-error http://127.0.0.1:8787/ready
      - name: Restart with existing data volume
        run: |
          docker compose restart latedev-router
          docker compose up -d --no-build --pull never --wait --wait-timeout 120 latedev-router
          curl --fail --silent --show-error http://127.0.0.1:8787/ready
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --no-color latedev-router
      - name: Clean up isolated service
        if: always()
        run: docker compose down --volumes --remove-orphans
