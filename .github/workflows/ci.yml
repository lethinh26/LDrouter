# Acceptance gates (docs/10): install → lint → typecheck → test → build →
# npm pack dry-run (tarball must contain CLI, web assets and migrations).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and verify npm tarball contents
        run: |
          # Run explicit build (no need for prepack hook since we removed it)
          pnpm run build
          # Capture npm pack output to verify all required files are included
          OUTPUT=$(npm pack --dry-run 2>&1 || true)
          echo "Tarball contents:"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dist/cli.js" || { echo "FAIL: dist/cli.js not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "dist/web/index.html" || { echo "FAIL: dist/web/index.html not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "migrations/0001_initial_schema.sql" || { echo "FAIL: migrations not in tarball"; exit 1; }
          echo "$OUTPUT" | grep -q "CHANGELOG.md" || { echo "FAIL: CHANGELOG.md not in tarball"; exit 1; }
          echo "✓ tarball OK"
