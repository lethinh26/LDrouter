name: Build and Deploy Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lethinh26/ldrouter

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build:
    name: Build Docker image
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        run: docker build --build-arg APP_VERSION=sha-${GITHUB_SHA::12} --tag local/ldrouter:smoke .

      - name: Smoke test image entrypoint and health endpoint
        run: |
          set -euo pipefail
          docker run --detach --rm --name ldrouter-smoke \
            --env LATEDEV_MASTER_KEY=12345678901234567890123456789012 \
            --publish 18787:8787 \
            local/ldrouter:smoke
          trap 'docker logs ldrouter-smoke || true; docker stop ldrouter-smoke || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Docker image did not become healthy' >&2
          exit 1

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo 'VPS_SSH_KEY is not configured' >&2; exit 1; }
          test -n "$VPS_HOST" || { echo 'VPS_HOST is not configured' >&2; exit 1; }
          test -n "$VPS_PORT" || { echo 'VPS_PORT is not configured' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Authenticate VPS Docker daemon to GHCR
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo 'VPS_USER is not configured' >&2; exit 1; }
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'docker login ghcr.io --username github-actions --password-stdin'

      - name: Pull and restart the new image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_WORKDIR: ${{ secrets.VPS_WORKDIR }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_WORKDIR" || { echo 'VPS_WORKDIR is not configured' >&2; exit 1; }
          remote_workdir=$(printf '%q' "$VPS_WORKDIR")
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "VPS_WORKDIR=$remote_workdir IMAGE_TAG=$IMAGE_TAG IMAGE=$IMAGE bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$VPS_WORKDIR"

          service=latedev-router
          override_file=".latedev-deploy.override.yml"
          cleanup() { rm -f "$override_file"; }
          trap cleanup EXIT
          printf 'services:\n  %s:\n    image: %s:%s\n' "$service" "$IMAGE" "$IMAGE_TAG" > "$override_file"
          compose=(docker compose -f docker-compose.yml -f "$override_file")
          old_image=''
          container_id="$("${compose[@]}" ps -q "$service" 2>/dev/null || true)"
          if [ -n "$container_id" ]; then
            old_image="$(docker inspect "$container_id" --format '{{.Config.Image}}' 2>/dev/null || true)"
          fi

          rollback() {
            if [ -n "$old_image" ]; then
              echo "Deployment failed; rolling back to $old_image" >&2
              printf 'services:\n  %s:\n    image: %s\n' "$service" "$old_image" > "$override_file"
              "${compose[@]}" up -d --no-build "$service" || true
            fi
          }
          trap rollback ERR

          "${compose[@]}" pull "$service"
          "${compose[@]}" up -d --no-build "$service"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo 'Deployed container did not become healthy' >&2
              exit 1
            fi
            sleep 2
          done

          running_image="$(docker inspect "$("${compose[@]}" ps -q "$service")" --format '{{.Config.Image}}')"
          test "$running_image" = "$IMAGE:$IMAGE_TAG"
          trap - ERR
          echo "Deployed $running_image"
          REMOTE
